name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name dairy_bill .
      - name: Set Android app name
        run: sed -i 's/android:label="[^"]*"/android:label="Dairy Bill"/' android/app/src/main/AndroidManifest.xml
      - name: Get packages
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/dairy-bill.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dairy-bill-release-apk
          path: build/app/outputs/flutter-apk/dairy-bill.apk
